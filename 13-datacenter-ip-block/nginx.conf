# Block datacenter ASNs via MaxMind GeoIP2
# apt-get install libnginx-mod-http-geoip2

load_module modules/ngx_http_geoip2_module.so;

http {
    geoip2 /usr/share/GeoIP/GeoLite2-ASN.mmdb {
        $geoip2_asn autonomous_system_number;
    }

    map $geoip2_asn $is_datacenter {
        default  0;
        14618    1; # Amazon
        16509    1; # Amazon AWS
        15169    1; # Google
        8075     1; # Microsoft Azure
        14061    1; # DigitalOcean
        63949    1; # Linode
        20473    1; # Vultr
        24940    1; # Hetzner
    }

    server {
        if ($is_datacenter) { return 403; }
    }
}
