# TLS fingerprinting via Nginx + Lua (requires OpenResty or nginx-lua)
# Known JA3 hashes for scrapers: check https://ja3er.com/

server {
    listen 443 ssl;
    ssl_certificate     /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;

    # Requires ssl_ja3 module (e.g. nginx-ssl-fingerprint patch)
    # ssl_ja3 on;

    access_by_lua_block {
        local known_bots = {
            ["e7d705a3286e19ea42f587b344ee6865"] = "python-requests",
            ["b32309a26951912be7dba376398abc3b"] = "curl",
        }
        local fp = ngx.var.ssl_ja3_hash
        if fp and known_bots[fp] then
            ngx.log(ngx.WARN, "Bot fingerprint: " .. known_bots[fp])
            ngx.exit(403)
        end
    }
}
