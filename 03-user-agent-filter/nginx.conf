# User-Agent filtering in Nginx
# Include in your server block

map $http_user_agent $bad_bot {
    default             0;
    ~*python-requests   1;
    ~*python-urllib     1;
    ~*scrapy            1;
    ~*curl              1;
    ~*wget              1;
    ~*libwww-perl       1;
    ~*Go-http-client    1;
    ~*java/             1;
    ~*ruby              1;
    ~*perl/             1;
    # Allow legitimate search engines
    ~*Googlebot         0;
    ~*YandexBot         0;
    ~*bingbot           0;
    # Empty UA is suspicious
    ""                  1;
}

server {
    if ($bad_bot) {
        return 403;
    }
}
